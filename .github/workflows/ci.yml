name: CI

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: 1.98.1
  AGAVE_VERSION: v4.1.2

jobs:
  program:
    name: Anchor program
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: program
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - name: Cache Agave and platform-tools
        uses: actions/cache@v4
        with:
          path: |
            ~/agave
            ~/.cache/solana
          key: agave-${{ env.AGAVE_VERSION }}-${{ runner.os }}
      - name: Install Agave (cargo build-sbf)
        run: |
          if [ ! -x "$HOME/agave/solana-release/bin/cargo-build-sbf" ]; then
            mkdir -p "$HOME/agave"
            curl -sSfL "https://github.com/anza-xyz/agave/releases/download/${AGAVE_VERSION}/solana-release-x86_64-unknown-linux-gnu.tar.bz2" \
              | tar -xj -C "$HOME/agave"
          fi
          echo "$HOME/agave/solana-release/bin" >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: program
      - name: Build the program
        run: cargo build-sbf --arch v0 --manifest-path programs/moment/Cargo.toml
      - name: Clippy
        run: cargo clippy -p moment --all-targets -- -D warnings
      - name: Tests
        run: cargo test -p moment

  keyserver:
    name: Keyserver
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: keyserver
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: moment
          POSTGRES_PASSWORD: moment-local-test
          POSTGRES_DB: moment_test
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U moment -d moment_test"
          --health-interval 2s --health-timeout 2s --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://moment:moment-local-test@127.0.0.1:55432/moment_test?sslmode=disable
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: keyserver
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Tests
        run: cargo test --locked

  helm:
    name: Helm chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install jsonschema pyyaml
      - run: python keyserver/helm/moment-keyserver/tests/render.py

  app:
    name: Android app
    needs: [program, keyserver, helm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: app
    env:
      MOMENT_DEVNET_BACKEND_URL: ${{ vars.MOMENT_DEVNET_BACKEND_URL }}
      MOMENT_DEVNET_PROGRAM_ID: ${{ vars.MOMENT_DEVNET_PROGRAM_ID }}
    steps:
      - uses: actions/checkout@v5
      - name: Validate release configuration
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: |
          python3 - <<'PY'
          import os
          from urllib.parse import urlsplit

          value = os.environ.get("MOMENT_DEVNET_BACKEND_URL", "")
          if not value:
              raise SystemExit("::error::Set the MOMENT_DEVNET_BACKEND_URL GitHub Actions variable before tagging a release")
          try:
              url = urlsplit(value)
              valid = (
                  value == value.strip()
                  and url.scheme == "https"
                  and bool(url.hostname)
                  and url.username is None
                  and url.password is None
                  and url.port != 0
                  and url.path in ("", "/")
                  and not url.query
                  and not url.fragment
              )
          except ValueError:
              valid = False
          if not valid:
              raise SystemExit("::error::MOMENT_DEVNET_BACKEND_URL must be an HTTPS origin without credentials, path, query, or fragment")

          program_id = os.environ.get("MOMENT_DEVNET_PROGRAM_ID", "")
          if not program_id:
              raise SystemExit("::error::Set the MOMENT_DEVNET_PROGRAM_ID GitHub Actions variable before tagging a release")
          alphabet = "123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz"
          number = 0
          for character in program_id:
              if character not in alphabet:
                  raise SystemExit("::error::MOMENT_DEVNET_PROGRAM_ID must be a Solana base58 public key")
              number = number * 58 + alphabet.index(character)
          decoded_length = (number.bit_length() + 7) // 8 + len(program_id) - len(program_id.lstrip("1"))
          if decoded_length != 32:
              raise SystemExit("::error::MOMENT_DEVNET_PROGRAM_ID must decode to 32 bytes")
          PY
      - name: Restore release signing key
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "Missing GitHub Actions secret: $name" >&2
              exit 1
            fi
          done
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/moment-release.jks"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          # Override the default, which includes the unavailable legacy "tools" package.
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v5
      - name: Unit tests (devnet)
        run: ./gradlew --no-daemon :app:testDevnetDebugUnitTest
      - name: Lint
        run: ./gradlew --no-daemon :app:lintDevnetDebug
      - name: Debug APK
        run: ./gradlew --no-daemon :app:assembleDevnetDebug
      # ~200 Mo par APK : le stockage Actions et Packages (500 Mo en offre
      # gratuite, partagé par tout le compte) ne supporte pas un envoi par push.
      # Seulement à la demande (« Run workflow »), gardé un jour ; les releases
      # taguées vont dans GitHub Releases, qui ne compte pas dans ce quota.
      - uses: actions/upload-artifact@v5
        if: github.event_name == 'workflow_dispatch'
        with:
          name: moment-apk-${{ github.sha }}
          path: |
            app/app/build/outputs/apk/devnet/debug/app-devnet-debug.apk
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
      - name: Signed devnet release APK
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          # Seulement ici : Gradle exige les mots de passe dès qu'il voit ce chemin,
          # ce qui ferait échouer les étapes de test et de lint.
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/moment-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: ./gradlew --no-daemon :app:assembleDevnetRelease "-PversionTag=$RELEASE_TAG"
      - name: Verify APK signatures
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: |
          apksigner="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner"
          for apk in app/build/outputs/apk/devnet/release/*.apk; do
            "$apksigner" verify --verbose "$apk"
          done
      - name: Prepare GitHub Release with APKs
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mkdir -p release-assets
          cp app/build/outputs/apk/devnet/release/app-devnet-release.apk "release-assets/moment-${RELEASE_TAG}-devnet.apk"
          (cd release-assets && sha256sum *.apk > SHA256SUMS.txt)
          if gh release view "$RELEASE_TAG" --json isDraft > release-state.json; then
            python3 - <<'PY'
          import json
          if not json.load(open('release-state.json'))['isDraft']:
              raise SystemExit('Release already published; refusing to replace its assets')
          PY
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --generate-notes --title "Moment $RELEASE_TAG"
          fi
          gh release upload "$RELEASE_TAG" release-assets/*.apk release-assets/SHA256SUMS.txt --clobber
          gh release edit "$RELEASE_TAG" --draft=false

  # Publication de l'image keyserver sur GHCR désactivée : elle remplissait le quota
  # de stockage Packages, et le déploiement Compose construit l'image sur le VPS.
  # Construction manuelle : voir « Docker image » dans keyserver/README.md.
  # Pour la réactiver, décommenter le job ci-dessous.
