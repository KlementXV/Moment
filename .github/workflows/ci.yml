name: CI

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: 1.98.1
  AGAVE_VERSION: v4.1.2

jobs:
  program:
    name: Anchor program
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: program
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - name: Cache Agave and platform-tools
        uses: actions/cache@v4
        with:
          path: |
            ~/agave
            ~/.cache/solana
          key: agave-${{ env.AGAVE_VERSION }}-${{ runner.os }}
      - name: Install Agave (cargo build-sbf)
        run: |
          if [ ! -x "$HOME/agave/solana-release/bin/cargo-build-sbf" ]; then
            mkdir -p "$HOME/agave"
            curl -sSfL "https://github.com/anza-xyz/agave/releases/download/${AGAVE_VERSION}/solana-release-x86_64-unknown-linux-gnu.tar.bz2" \
              | tar -xj -C "$HOME/agave"
          fi
          echo "$HOME/agave/solana-release/bin" >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: program
      - name: Build the program
        run: cargo build-sbf --arch v0 --manifest-path programs/moment/Cargo.toml
      - name: Clippy
        run: cargo clippy -p moment --all-targets -- -D warnings
      - name: Tests
        run: cargo test -p moment

  keyserver:
    name: Keyserver
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: keyserver
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: moment
          POSTGRES_PASSWORD: moment-local-test
          POSTGRES_DB: moment_test
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U moment -d moment_test"
          --health-interval 2s --health-timeout 2s --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://moment:moment-local-test@127.0.0.1:55432/moment_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: keyserver
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Tests
        run: cargo test --locked

  helm:
    name: Helm chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install jsonschema pyyaml
      - run: python keyserver/helm/moment-keyserver/tests/render.py

  app:
    name: Android app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    env:
      MOMENT_DEVNET_BACKEND_URL: ${{ vars.MOMENT_DEVNET_BACKEND_URL }}
      MOMENT_MAINNET_BACKEND_URL: ${{ vars.MOMENT_MAINNET_BACKEND_URL }}
      MOMENT_MAINNET_RPC_URL: ${{ secrets.MOMENT_MAINNET_RPC_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests (devnet and mainnet)
        run: ./gradlew --no-daemon :app:testDevnetDebugUnitTest :app:testMainnetDebugUnitTest
      - name: Lint
        run: ./gradlew --no-daemon :app:lintDevnetDebug
      - name: APK
        run: ./gradlew --no-daemon :app:assembleDevnetDebug :app:assembleMainnetDebug
      - uses: actions/upload-artifact@v4
        with:
          name: moment-apk-${{ github.sha }}
          path: |
            app/app/build/outputs/apk/devnet/debug/app-devnet-debug.apk
            app/app/build/outputs/apk/mainnet/debug/app-mainnet-debug.apk
          retention-days: 14
          if-no-files-found: error

  image:
    name: Keyserver image (GHCR)
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: [keyserver, helm]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Image name (GHCR requires lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/moment-keyserver" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha
            type=ref,event=branch
            type=semver,pattern={{version}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: keyserver/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
